version: '3.9'
services:
  postgres:
    image: ankane/pgvector:latest
    container_name: campus-postgres
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campus']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
